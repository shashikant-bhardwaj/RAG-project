[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shashikant-bhardwaj", email = "bhardwajshashi531@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-text-splitters>=1.1.2",
    "mistralai>=2.9.4",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
